<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .contact-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .contact-header {
      margin-bottom: 28px;
    }

    .contact-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .contact-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .contact-card {
      display: flex;
      align-items: center;
      padding: 16px;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      text-decoration: none;
      color: var(--text-main);
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    .contact-card:hover {
      background-color: rgba(255, 255, 255, 0.07);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .contact-icon {
      width: 24px;
      height: 24px;
      margin-right: 16px;
      fill: var(--accent-color);
      flex-shrink: 0;
    }

    .contact-details {
      display: flex;
      flex-direction: column;
    }

    .contact-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .contact-value {
      font-size: 1rem;
      font-weight: 500;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <section class="contact-container">
    <div class="contact-header">
      <h2>Get in Touch</h2>
      <p>Feel free to reach out via email or connect with me on LinkedIn.</p>
    </div>

    <div class="contact-links">
      <!-- Email Card -->
      <a href="mailto:cpnew103@gmail.com" class="contact-card">
        <svg class="contact-icon" viewBox="0 0 24 24">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        <div class="contact-details">
          <span class="contact-label">Email</span>
          <span class="contact-value">cpnew103@gmail.com</span>
        </div>
      </a>

      <!-- LinkedIn Card -->
      <a href="https://www.linkedin.com/in/connor-new42" target="_blank" rel="noopener noreferrer" class="contact-card">
        <svg class="contact-icon" viewBox="0 0 24 24">
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
        </svg>
        <div class="contact-details">
          <span class="contact-label">LinkedIn</span>
          <span class="contact-value">linkedin.com/in/connor-new42</span>
        </div>
      </a>
    </div>
  </section>

</body>
</html>
